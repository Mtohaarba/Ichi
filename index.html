<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenangan Kita</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Newsreader:ital@1&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#0a0a0a;--mut:#5b5f6b;--line:#e4e6ee;--r:#E63946;--b:#2D4BDB;--g:linear-gradient(120deg,#E63946,#2D4BDB);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07070a;--card:#13131a;--ink:#f4f4f7;--mut:#9a9eb0;--line:#262633}}
:root[data-theme="dark"]{--bg:#07070a;--card:#13131a;--ink:#f4f4f7;--mut:#9a9eb0;--line:#262633}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Bricolage Grotesque',system-ui,sans-serif}
.serif{font-family:'Newsreader',Georgia,serif;font-style:italic}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px)}
.logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
#live{font-size:12px;font-weight:500;color:var(--mut);display:flex;align-items:center;gap:5px}
#live i{width:8px;height:8px;border-radius:50%;background:#2bd46b;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(43,212,107,0)}0%{box-shadow:0 0 0 0 rgba(43,212,107,.6)}}
nav{display:flex;gap:4px}
nav button{border:0;background:none;padding:8px 14px;border-radius:99px;font-weight:500}
nav button.on{background:var(--ink);color:var(--bg)}
.add{background:var(--g);border:0;border-radius:99px;padding:9px 18px;font-weight:800;color:#fff}
main{max-width:1100px;margin:0 auto;padding:0 20px 60px}
.hero{padding:44px 0 28px;position:relative;isolation:isolate;overflow:clip}
.blob{position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.4;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(50px,30px) scale(1.2)}}
h1{font-size:clamp(40px,9vw,88px);line-height:.95;margin:0 0 14px;font-weight:800;letter-spacing:-.03em}
.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#hq{font-size:22px;color:var(--mut);max-width:560px;min-height:66px;margin:0 0 20px;animation:fade .8s}
#hq small{font-size:16px;font-style:normal}
@keyframes fade{from{opacity:0}}
.faces{display:flex;flex-wrap:wrap}
.faces .av{width:84px;height:84px;margin-left:-16px;border:5px solid var(--bg);font-size:28px;animation:bob 3.2s ease-in-out infinite;cursor:pointer}
.faces>*:first-child .av{margin-left:0}
@keyframes bob{50%{transform:translateY(-8px)}}
.stats{display:flex;gap:28px;margin-top:18px}
.stats b{font-size:36px;display:block;line-height:1}.stats span{color:var(--mut)}
h2{font-size:30px;margin:36px 0 16px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{background:var(--card);border-radius:8px;padding:10px 10px 14px;box-shadow:0 0 0 1px var(--line),0 8px 22px rgba(0,0,0,.1);cursor:pointer;text-align:left;border:0;transition:transform .25s,box-shadow .25s;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.card:nth-child(3n+1){transform:rotate(-1.4deg)}.card:nth-child(3n+2){transform:rotate(1deg)}.card:nth-child(3n){transform:rotate(-.4deg)}
.card:hover{transform:rotate(0) translateY(-6px);box-shadow:0 0 0 2px var(--r),0 14px 34px rgba(45,75,219,.3)}
@keyframes rise{from{opacity:0;translate:0 28px}}
.cover{aspect-ratio:4/3;border-radius:4px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:56px;position:relative;overflow:hidden}
.badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;padding:2px 9px;border-radius:99px}
.card h3{margin:12px 4px 2px;font-size:20px}.meta{margin:0 4px;color:var(--mut);font-size:14px}
.stack{display:flex;margin:10px 4px 0}
.av{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;background-size:cover;background-position:center;flex:none}
.stack .av{width:28px;height:28px;font-size:12px;margin-left:-8px;border:2px solid var(--card)}.stack .av:first-child{margin-left:0}
.mgrid{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:30px}
.mcard{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 24px;overflow:hidden}
.mban{width:100%;height:110px;border-radius:4px}
.mcard .av{width:140px;height:140px;font-size:46px;margin-top:-70px;border:5px solid var(--card);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.mcard:hover .av{transform:scale(1.08) rotate(-4deg)}
.mcard h3{margin:14px 0 0;font-size:24px}.role{font-size:20px;color:var(--mut)}
.mbio{margin:6px 20px 8px;color:var(--mut);font-size:15px}
.wall{columns:260px;column-gap:20px}
.word{break-inside:avoid;margin:0 0 20px;padding:22px;border-radius:14px;background:var(--card);position:relative;box-shadow:0 0 0 1px var(--line);animation:rise .6s both}
.word::before{content:'';position:absolute;inset:0;border-radius:14px;padding:2px;background:var(--g);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.7}
.word p{font-size:22px;margin:0 0 12px;line-height:1.35}.word small{color:var(--mut)}
.word button{float:right;border:0;background:none;color:var(--mut);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:12px}
dialog{border:0;border-radius:16px;padding:0;width:min(720px,94vw);max-height:90vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(5,5,12,.65);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .3s cubic-bezier(.2,1.2,.4,1)}@keyframes pop{from{transform:scale(.92) translateY(20px);opacity:0}}
.in{padding:24px;overflow:auto;max-height:90vh}
.x{float:right;border:0;background:var(--line);width:36px;height:36px;border-radius:50%;font-size:18px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:zoom-in;transition:transform .25s}.photos img:hover{transform:scale(1.05) rotate(-1deg)}
video{width:100%;border-radius:10px;margin:8px 0;background:#000}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer}
.chip .av{width:26px;height:26px;font-size:11px}
label{display:block;font-weight:500;margin:14px 0 4px}
input[type=text],input[type=date],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label{margin:0;display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:400}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.prev img{width:54px;height:54px;object-fit:cover;border-radius:6px}
.save{margin-top:20px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:800}.save:disabled{opacity:.6}
.note{font-size:13px;color:var(--mut);margin:4px 0}
.del{border:0;background:none;color:var(--r);margin:14px 14px 0 0;padding:0}
.upl{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:99px;background:var(--line);cursor:pointer;font-weight:500}
#lb{background:transparent;box-shadow:none;width:auto}#lb img{max-width:94vw;max-height:84vh;display:block;margin:auto;border-radius:10px;animation:pop .4s}
/* stage */
.stage{position:fixed;inset:0;z-index:50;background:#050505;color:#fff;display:none;overflow:auto;overscroll-behavior:contain}
.stage.on{display:block;animation:fade .4s}
.sbg{position:fixed;inset:-10%;background-size:cover;background-position:center;filter:blur(55px) saturate(1.3) brightness(.45);animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.15) translate(2%,-2%)}}
.stage::before,.stage::after{content:'';position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.35;animation:drift 10s ease-in-out infinite alternate}
.stage::before{background:var(--r);left:-15vmax;top:-10vmax}.stage::after{background:var(--b);right:-15vmax;bottom:-10vmax;animation-delay:-5s}
.sc{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(70px + env(safe-area-inset-top,0px)) 20px 50px;text-align:center}
.sc.fr{animation:inR .55s cubic-bezier(.2,.8,.2,1)}.sc.fl{animation:inL .55s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{opacity:0;transform:translateX(90px)}}@keyframes inL{from{opacity:0;transform:translateX(-90px)}}
.pw{position:relative;width:min(68vw,340px);aspect-ratio:1;animation:pop2 1s cubic-bezier(.2,1.3,.3,1) both;transition:transform .15s}
@keyframes pop2{from{opacity:0;transform:scale(.4) rotate(-20deg)}}
.ring{position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(#E63946,#fff,#2D4BDB,#000,#E63946);animation:spin 7s linear infinite;box-shadow:0 0 60px rgba(230,57,70,.5),0 0 90px rgba(45,75,219,.4)}
@keyframes spin{to{transform:rotate(1turn)}}
.ph{position:absolute;inset:0;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font-size:90px;font-weight:800;border:6px solid #050505}
.nm{font-size:clamp(34px,8vw,64px);margin:30px 0 4px;letter-spacing:-.02em;font-weight:800}
.nm span{display:inline-block;animation:letter .7s both;animation-delay:calc(.4s + var(--i)*.045s)}
@keyframes letter{from{opacity:0;transform:translateY(34px) rotate(8deg);filter:blur(6px)}}
.sc .role{color:#cfd2e0;animation:rise .7s .9s both}.sc .bio{max-width:480px;color:#e6e8f2;animation:rise .7s 1.05s both}
.strip{display:flex;gap:10px;margin-top:18px;overflow-x:auto;max-width:100%;padding:8px}
.strip img{width:100px;height:100px;object-fit:cover;border-radius:14px;cursor:zoom-in;animation:rise .6s both;animation-delay:calc(1.1s + var(--i)*.09s);transition:transform .3s}.strip img:hover{transform:scale(1.12) rotate(-3deg)}
.cnt{margin-top:16px;color:#9aa;font-size:13px}
.sx,.nv{position:fixed;z-index:3;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:48px;height:48px;font-size:24px;backdrop-filter:blur(8px)}
.sx{top:calc(14px + env(safe-area-inset-top,0px));right:14px}.nv{top:50%;margin-top:-24px}.nv.p{left:12px}.nv.n{right:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">Kenangan Kita <span id="live" hidden><i></i><span id="lt">Live</span></span></div>
  <nav><button data-v="act" class="on">Kegiatan</button><button data-v="mem">Anggota</button><button data-v="wrd">Kata-kata</button></nav>
  <button class="add" id="addBtn">Tambah</button>
</header>
<main>
  <section class="hero">
    <i class="blob" style="background:#E63946;width:260px;height:260px;right:4%;top:10px"></i>
    <i class="blob" style="background:#2D4BDB;width:300px;height:300px;right:24%;top:150px;animation-delay:-6s"></i>
    <h1>Semua cerita<br>kita, <span class="serif gt">di satu tempat.</span></h1>
    <p id="hq" class="serif"></p>
    <div class="faces" id="faces"></div>
    <div class="stats" id="stats"></div>
  </section>
  <div id="view"></div>
</main>
<dialog id="dlg"><div class="in" id="dc"></div></dialog>
<dialog id="lb" onclick="lb.close()"><img id="lbi" alt=""></dialog>
<div class="stage" id="stage"><div class="sbg" id="sbg"></div><button class="sx" onclick="sclose()" aria-label="Tutup">×</button><button class="nv p" onclick="stage(si-1,-1)" aria-label="Sebelumnya">‹</button><button class="nv n" onclick="stage(si+1,1)" aria-label="Berikutnya">›</button><div class="sc" id="sc"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hs=id=>Math.abs([...String(id)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7));
const grad=id=>{const h=hs(id);return `linear-gradient(${h%360}deg,${h%2?'#E63946,#2D4BDB':'#2D4BDB,#E63946'})`};
const bg=(u,id)=>u?`url('${esc(u)}')`:grad(id);
let db,assets,S={members:[],acts:[],words:[]},view='act',cur=null,si=0,qi=0;
const KEY={members:'members',acts:'acts',words:'words'};
const M=id=>S.members.find(m=>m.id===id);
const ini=n=>String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const av=(m,cls='')=>`<div class="av ${cls}" title="${esc(m.name)}" style="background-image:${bg(m.photo,m.id)}">${m.photo?'':esc(ini(m.name))}</div>`;
const fmt=d=>{try{return new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
const mi=id=>S.members.findIndex(m=>m.id===id);

async function boot(){
  try{
    db=await claude.use('db');assets=await claude.use('assets');
    if(db){
      $('#live').hidden=false;
      for(const c in KEY)db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>c==='acts'?String(b.date).localeCompare(a.date):c==='words'?(b.createdAt||0)-(a.createdAt||0):(a.createdAt||0)-(b.createdAt||0));render()},()=>{$('#lt').textContent='Offline'});
    }
    const room=await claude.use('room');
    if(room){room.presence({here:1});room.onPeers(p=>{const n=Array.isArray(p)?p.length:Object.keys(p||{}).length;$('#lt').textContent='Live · '+Math.max(1,n)+' online'})}
  }catch(e){}
}
function render(){
  $('#faces').innerHTML=S.members.slice(0,12).map((m,i)=>`<div style="display:contents" onclick="stage(${i})">${av(m)}</div>`).join('');
  document.querySelectorAll('#faces .av').forEach((e,i)=>e.style.animationDelay=i*.25+'s');
  const np=S.acts.reduce((a,x)=>a+(x.photos||[]).length,0),nv=S.acts.reduce((a,x)=>a+(x.videos||[]).length,0);
  $('#stats').innerHTML=[[S.members.length,'anggota'],[S.acts.length,'kegiatan'],[np,'foto'],[nv,'video'],[S.words.length,'kata-kata']].map(([n,l])=>`<div><b class="gt">${n}</b><span>${l}</span></div>`).join('');
  if(!$('#hq').textContent)tick();
  const v=$('#view');
  if(view==='act')v.innerHTML='<h2>Kegiatan</h2>'+(S.acts.length?`<div class="grid">${S.acts.map(a=>{const p=a.photos||[],vd=a.videos||[];return `<button class="card" onclick="showA('${a.id}')"><div class="cover" style="background-image:${bg(p[0],a.id)}">${p[0]?'':esc(a.emoji||'✨')}${p.length+vd.length?`<span class="badge">${p.length} foto${vd.length?` · ${vd.length} video`:''}</span>`:''}</div><h3>${esc(a.title)}</h3><p class="meta">${fmt(a.date)}</p><div class="stack">${(a.who||[]).map(M).filter(Boolean).slice(0,6).map(m=>av(m)).join('')}</div></button>`}).join('')}</div>`:'<div class="empty">Belum ada kegiatan. Tekan Tambah untuk menyimpan yang pertama.</div>');
  else if(view==='mem')v.innerHTML='<h2>Anggota</h2>'+(S.members.length?`<div class="grid mgrid">${S.members.map((m,i)=>`<button class="card mcard" onclick="stage(${i})"><div class="mban" style="background:${grad(m.id)}"></div>${av(m)}<h3>${esc(m.name)}</h3><div class="role serif">${esc(m.role||'Anggota')}</div><p class="mbio">${esc((m.bio||'').slice(0,80))}</p><p class="meta">${S.acts.filter(a=>(a.who||[]).includes(m.id)).length} kegiatan</p></button>`).join('')}</div>`:'<div class="empty">Belum ada anggota. Tekan Tambah untuk mengisi profil pertama.</div>');
  else v.innerHTML='<h2>Kata-kata</h2>'+(S.words.length?`<div class="wall">${S.words.map(w=>`<div class="word"><button onclick="delDoc('words','${w.id}')" aria-label="Hapus">hapus</button><p class="serif">“${esc(w.text)}”</p><small>— ${esc(w.name||'Anonim')}</small></div>`).join('')}</div>`:'<div class="empty">Belum ada kata-kata. Tinggalkan pesan pertama untuk komunitas.</div>');
  document.querySelectorAll('.card,.word').forEach((c,i)=>c.style.animationDelay=Math.min(i,12)*70+'ms');
  if(cur&&dlg.open){const it=(cur.t==='a'?S.acts:S.members).find(x=>x.id===cur.id);if(!it)dlg.close();else if(JSON.stringify(it)!==cur.sig){cur.t==='a'?showA(cur.id):showM(cur.id)}}
}
function tick(){const w=S.words;const h=$('#hq');if(!w.length){h.textContent='';return}const x=w[qi++%w.length];h.style.animation='none';void h.offsetWidth;h.style.animation='';h.innerHTML=`“${esc(x.text)}” <small>— ${esc(x.name||'Anonim')}</small>`}
setInterval(tick,5500);
const open=h=>{$('#dc').innerHTML=`<button class="x" onclick="dlg.close()" aria-label="Tutup">×</button>${h}`;dlg.showModal()};
const gal=p=>p.length?`<div class="photos">${p.map(s=>`<img src="${esc(s)}" alt="" onclick="zoom(this.src)">`).join('')}</div>`:'';
function zoom(s){$('#lbi').src=s;lb.showModal()}
async function delDoc(c,id){if(!confirm('Hapus data ini?'))return;try{await db.doc(c+'/'+id).delete();dlg.close()}catch(e){alert('Tidak bisa menghapus (perlu akses kontributor).')}}
function showA(id){
  const a=S.acts.find(x=>x.id===id);if(!a)return;cur={t:'a',id,sig:JSON.stringify(a)};
  open(`<h2 style="margin-top:0">${esc(a.title)}</h2><p class="serif" style="font-size:20px;margin:0">${fmt(a.date)}</p><p>${esc(a.desc||'')}</p>${gal(a.photos||[])}${(a.videos||[]).map(s=>`<video src="${esc(s)}" controls playsinline></video>`).join('')}<label class="upl">+ Tambah foto/video<input type="file" id="more" accept="image/*,video/*" multiple hidden ${assets?'':'disabled'}></label><div><b>Yang ikut</b></div><div class="chips">${(a.who||[]).map(M).filter(Boolean).map(m=>`<button class="chip" onclick="stage(${mi(m.id)})">${av(m)}${esc(m.name)}</button>`).join('')||'<span class="note">Belum ada anggota ditandai.</span>'}</div><button class="del" onclick="delDoc('acts','${a.id}')">Hapus kegiatan</button>`);
  $('#more').onchange=async e=>{try{const r=await upFiles(e.target.files);await db.doc('acts/'+id).update({photos:[...(a.photos||[]),...r.p],videos:[...(a.videos||[]),...r.v]})}catch(x){alert(x.message||'Gagal mengunggah')}};
}
function showM(id){
  const m=M(id);if(!m)return;cur={t:'m',id,sig:JSON.stringify(m)};
  open(`<div style="display:flex;gap:16px;align-items:center;margin-top:6px"><div style="width:100px">${av(m).replace('style="','style="width:100px;height:100px;font-size:34px;')}</div><div><h2 style="margin:0">${esc(m.name)}</h2><div class="role serif">${esc(m.role||'Anggota')}</div></div></div><p>${esc(m.bio||'')}</p><button class="del" onclick="delDoc('members','${m.id}')">Hapus anggota</button>`);
}
const shrink=(f,mx=1600)=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>r(b||f),'image/jpeg',.85)};i.onerror=()=>r(f);i.src=u});
async function upFiles(fl){
  if(!assets)throw Error('Upload perlu akses kontributor');
  const p=[],v=[];
  for(const f of fl){
    if(f.type.startsWith('video/')){if(f.size>20*1048576)throw Error('Video maksimal 20 MB: '+f.name);v.push((await assets.upload(f)).url)}
    else if(f.type.startsWith('image/'))p.push((await assets.upload(await shrink(f))).url);
  }
  return{p,v};
}
async function guard(btn,fn){if(!db){alert('Belum terhubung ke penyimpanan.');return}const t=btn.textContent;btn.disabled=true;btn.textContent='Menyimpan…';try{await fn();dlg.close()}catch(e){alert('Gagal menyimpan: '+(e&&e.message||'coba lagi'));btn.disabled=false;btn.textContent=t}}
const dis=()=>assets?'':'disabled';
function formM(){
  cur=null;open(`<h2 style="margin-top:0">Anggota baru</h2><label for="fn">Nama</label><input type="text" id="fn"><label for="fr">Peran</label><input type="text" id="fr" placeholder="Contoh: Seksi acara"><label for="fb">Cerita singkat</label><textarea id="fb" rows="3"></textarea><label for="ff">Foto profil</label><input type="file" id="ff" accept="image/*" ${dis()}><button class="save" id="sv">Simpan anggota</button>`);
  $('#sv').onclick=()=>{const n=$('#fn').value.trim();if(!n){$('#fn').focus();return}guard($('#sv'),async()=>{const r=await upFiles($('#ff').files);await db.collection('members').add({name:n,role:$('#fr').value.trim(),bio:$('#fb').value.trim(),photo:r.p[0]||'',createdAt:Date.now()});view='mem';sync()})};
}
function formA(){
  cur=null;open(`<h2 style="margin-top:0">Kegiatan baru</h2><label for="at">Nama kegiatan</label><input type="text" id="at"><label for="ad">Tanggal</label><input type="date" id="ad"><label for="ae">Ikon (emoji)</label><input type="text" id="ae" maxlength="2" placeholder="⛺"><label for="ac">Cerita</label><textarea id="ac" rows="3"></textarea><label>Siapa yang ikut</label><div class="chk">${S.members.map(m=>`<label><input type="checkbox" value="${m.id}"> ${esc(m.name)}</label>`).join('')||'<span class="note">Tambahkan anggota dulu agar bisa ditandai.</span>'}</div><label for="ap">Foto dan video</label><input type="file" id="ap" accept="image/*,video/*" multiple ${dis()}><p class="note">Video maksimal 20 MB per file.${assets?'':' Upload perlu akses kontributor.'}</p><button class="save" id="sv">Simpan kegiatan</button>`);
  $('#sv').onclick=()=>{const t=$('#at').value.trim();if(!t){$('#at').focus();return}guard($('#sv'),async()=>{const r=await upFiles($('#ap').files);await db.collection('acts').add({title:t,date:$('#ad').value||new Date().toISOString().slice(0,10),emoji:$('#ae').value||'✨',desc:$('#ac').value.trim(),photos:r.p,videos:r.v,who:[...document.querySelectorAll('.chk input:checked')].map(i=>i.value),createdAt:Date.now()});view='act';sync()})};
}
function formW(){
  cur=null;open(`<h2 style="margin-top:0">Tulis kata-kata</h2><label for="wt">Pesan, kesan, atau kenangan</label><textarea id="wt" rows="4"></textarea><label for="wn">Nama</label><input type="text" id="wn"><button class="save" id="sv">Kirim</button>`);
  $('#sv').onclick=()=>{const t=$('#wt').value.trim();if(!t){$('#wt').focus();return}guard($('#sv'),async()=>{await db.collection('words').add({text:t,name:$('#wn').value.trim(),createdAt:Date.now()});view='wrd';sync()})};
}
function sync(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;sync()});
$('#addBtn').onclick=()=>({act:formA,mem:formM,wrd:formW})[view]();
/* stage: tampilan foto anggota */
function stage(i,dir=0){
  const L=S.members;if(!L.length)return;si=(i+L.length)%L.length;const m=L[si];
  if(dlg.open)dlg.close();$('#stage').classList.add('on');document.body.style.overflow='hidden';
  const as=S.acts.filter(a=>(a.who||[]).includes(m.id)),ph=as.flatMap(a=>a.photos||[]);
  $('#sbg').style.backgroundImage=bg(m.photo,m.id);
  const sc=$('#sc');sc.className='sc';void sc.offsetWidth;sc.className='sc '+(dir>0?'fr':dir<0?'fl':'');
  sc.innerHTML=`<div class="pw" id="pw"><i class="ring"></i><div class="ph" style="background-image:${bg(m.photo,m.id)}">${m.photo?'':esc(ini(m.name))}</div></div><h2 class="nm">${[...m.name].map((c,k)=>`<span style="--i:${k}">${c===' '?'&nbsp;':esc(c)}</span>`).join('')}</h2><div class="role serif">${esc(m.role||'Anggota')}</div><p class="bio">${esc(m.bio||'')}</p><div class="strip">${ph.slice(0,10).map((s,k)=>`<img src="${esc(s)}" style="--i:${k}" alt="" onclick="zoom(this.src)">`).join('')}</div><div class="cnt">${si+1} / ${L.length} · ${as.length} kegiatan</div>`;
  const pw=$('#pw');pw.onpointermove=e=>{const r=pw.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;pw.style.transform=`perspective(800px) rotateX(${-y*18}deg) rotateY(${x*22}deg) scale(1.04)`};pw.onpointerleave=()=>pw.style.transform='';
}
function sclose(){$('#stage').classList.remove('on');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(!$('#stage').classList.contains('on')||lb.open)return;if(e.key==='Escape')sclose();if(e.key==='ArrowRight')stage(si+1,1);if(e.key==='ArrowLeft')stage(si-1,-1)});
let sx0=0;$('#stage').addEventListener('pointerdown',e=>sx0=e.clientX);
$('#stage').addEventListener('pointerup',e=>{const d=e.clientX-sx0;if(Math.abs(d)>70&&!e.target.closest('button'))stage(si+(d<0?1:-1),d<0?1:-1)});
/* kartu miring mengikuti kursor */
if(matchMedia('(hover:hover)').matches){
$('#view').addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transition='transform .08s';c.style.transform=`perspective(700px) rotateX(${-y*8}deg) rotateY(${x*10}deg) translateY(-6px)`});
$('#view').addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){c.style.transition='';c.style.transform=''}});
}
render();boot();
</script>
</body>
</html>
