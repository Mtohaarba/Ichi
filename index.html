<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenangan Kita</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Newsreader:ital@1&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2EA;--card:#fff;--ink:#14281D;--mut:#5d7164;--acc:#E8C48A;--acc2:#7D8FCB;--line:#d3ddd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A14;--card:#18271f;--ink:#EAF2E8;--mut:#9bb0a2;--line:#2a3d32}}
:root[data-theme="dark"]{--bg:#0F1A14;--card:#18271f;--ink:#EAF2E8;--mut:#9bb0a2;--line:#2a3d32}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Bricolage Grotesque',system-ui,sans-serif}
.serif{font-family:'Newsreader',Georgia,serif;font-style:italic}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 20px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.logo{font-weight:800;font-size:20px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 14px;border-radius:99px;font-weight:500}
nav button.on{background:var(--ink);color:var(--bg)}
.add{background:var(--acc);border:0;border-radius:99px;padding:9px 16px;font-weight:800;color:#14281D}
main{max-width:1100px;margin:0 auto;padding:0 20px 60px}
.hero{padding:44px 0 28px;position:relative;isolation:isolate;overflow:clip}
.blob{position:absolute;z-index:-1;border-radius:50%;filter:blur(60px);opacity:.5;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(50px,30px) scale(1.2)}}
h1{font-size:clamp(40px,9vw,88px);line-height:.95;margin:0 0 14px;font-weight:800;letter-spacing:-.03em}
.hero p{font-size:22px;color:var(--mut);margin:0 0 24px;max-width:520px}
.faces{display:flex;flex-wrap:wrap;gap:0;margin-bottom:10px}
.faces .av{width:84px;height:84px;margin-left:-16px;border:5px solid var(--bg);font-size:28px;animation:bob 3.2s ease-in-out infinite;cursor:pointer}
.faces .av:first-child{margin-left:0}
@keyframes bob{50%{transform:translateY(-8px)}}
.stats{display:flex;gap:28px;margin-top:18px}
.stats b{font-size:34px;display:block;line-height:1}
.stats span{color:var(--mut)}
h2{font-size:30px;margin:36px 0 16px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{background:var(--card);border-radius:6px;padding:10px 10px 14px;box-shadow:0 6px 18px rgba(20,40,29,.12);cursor:pointer;text-align:left;border:0;transition:transform .25s}
.card:nth-child(3n+1){transform:rotate(-1.4deg)}.card:nth-child(3n+2){transform:rotate(1deg)}.card:nth-child(3n){transform:rotate(-.4deg)}
.card:hover{transform:rotate(0) translateY(-6px)}
.cover{aspect-ratio:4/3;border-radius:3px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:56px;position:relative;overflow:hidden}
.cover .badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:2px 9px;border-radius:99px}
.card h3{margin:12px 4px 2px;font-size:20px}
.card .meta{margin:0 4px;color:var(--mut);font-size:14px}
.stack{display:flex;margin:10px 4px 0}
.av{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;background-size:cover;background-position:center;flex:none}
.stack .av{width:28px;height:28px;font-size:12px;margin-left:-8px;border:2px solid var(--card)}
.stack .av:first-child{margin-left:0}
.mgrid{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:30px}
.mcard{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 24px;overflow:hidden}
.mban{width:100%;height:110px;border-radius:3px}
.mbio{margin:6px 20px 8px;color:var(--mut);font-size:15px}
.mcard:hover .av{transform:scale(1.07) rotate(-4deg)}
.mcard .av{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.mcard .av{width:140px;height:140px;font-size:46px;margin-top:-70px;border:5px solid var(--card)}
.mcard h3{margin:14px 0 0;font-size:24px}.role{font-size:20px;color:var(--mut)}
.empty{padding:40px;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:12px}
dialog{border:0;border-radius:16px;padding:0;width:min(720px,94vw);max-height:90vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,20,14,.6)}
dialog[open]{animation:pop .25s ease}@keyframes pop{from{transform:scale(.94);opacity:0}}
.in{padding:24px;overflow:auto;max-height:90vh}
.x{float:right;border:0;background:var(--card);width:36px;height:36px;border-radius:50%;font-size:18px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:zoom-in}
video{width:100%;border-radius:10px;margin:8px 0;background:#000}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px 4px 4px}
.chip .av{width:26px;height:26px;font-size:11px}
label{display:block;font-weight:500;margin:14px 0 4px}
input[type=text],input[type=date],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input[type=file]{width:100%}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{margin:0;display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-weight:400}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.prev img{width:54px;height:54px;object-fit:cover;border-radius:6px}
.save{margin-top:20px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:800}
.note{font-size:13px;color:var(--mut);margin:4px 0}
.del{border:0;background:none;color:#c0392b;margin-top:14px;padding:0}
#lb img{max-width:100%;max-height:84vh;display:block;margin:auto}
@keyframes rise{from{opacity:0;translate:0 28px}}
.card{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">Kenangan Kita</div>
  <nav>
    <button data-v="act" class="on">Kegiatan</button>
    <button data-v="mem">Anggota</button>
  </nav>
  <button class="add" id="addBtn">Tambah</button>
</header>
<main>
  <section class="hero"><i class="blob" style="background:#cdb8e0;width:260px;height:260px;right:4%;top:10px"></i><i class="blob" style="background:#b9d9c3;width:300px;height:300px;right:26%;top:150px;animation-delay:-6s"></i>
    <h1>Semua cerita<br>kita, <span class="serif">di satu tempat.</span></h1>
    <p>Foto, video, dan orang-orang di balik setiap kegiatan komunitas.</p>
    <div class="faces" id="faces"></div>
    <div class="stats" id="stats"></div>
  </section>
  <div id="view"></div>
</main>
<dialog id="dlg"><div class="in" id="dc"></div></dialog>
<dialog id="lb"><div class="in"><button class="x" onclick="lb.close()" aria-label="Tutup">×</button><img id="lbi" alt=""></div></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const hue=id=>[...id].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const grad=id=>`linear-gradient(135deg,hsl(${hue(id)} 34% 60%),hsl(${(hue(id)+35)%360} 32% 45%))`;
let S={members:[],acts:[]},view='act';
try{const r=localStorage.getItem('kk1');if(r)S=JSON.parse(r)}catch(e){}
if(!S.members.length){
  S.members=[
    {id:'m1',name:'Rani Putri',role:'Ketua',bio:'Pengikat semua rencana. Selalu bawa kamera.',photo:''},
    {id:'m2',name:'Bima Aditya',role:'Dokumentasi',bio:'Tukang foto dan video. Hobi mengejar golden hour.',photo:''},
    {id:'m3',name:'Sari Dewi',role:'Bendahara',bio:'Mencatat setiap rupiah dan setiap tawa.',photo:''},
    {id:'m4',name:'Dimas Pratama',role:'Seksi acara',bio:'Ide gila datang dari sini.',photo:''}];
  S.acts=[
    {id:'a1',title:'Camping Akhir Tahun',date:'2025-12-27',desc:'Dua hari satu malam di kaki gunung, api unggun dan gitar.',emoji:'⛺',photos:[],videos:[],who:['m1','m2','m4']},
    {id:'a2',title:'Bakti Sosial Desa',date:'2026-03-14',desc:'Bersih-bersih, mengajar anak-anak, dan makan bersama warga.',emoji:'🤝',photos:[],videos:[],who:['m1','m3','m4']},
    {id:'a3',title:'Buka Bersama',date:'2026-03-28',desc:'Kumpul lengkap pertama setelah sekian lama.',emoji:'🍲',photos:[],videos:[],who:['m1','m2','m3','m4']}];
}
function save(){try{localStorage.setItem('kk1',JSON.stringify({members:S.members,acts:S.acts.map(a=>({...a,videos:[]}))}))}catch(e){}}
const M=id=>S.members.find(m=>m.id===id);
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const av=(m,cls='')=>`<div class="av ${cls}" title="${esc(m.name)}" style="background-image:${m.photo?`url(${m.photo})`:grad(m.id)}">${m.photo?'':esc(ini(m.name))}</div>`;
const fmt=d=>{try{return new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
const photosOf=m=>S.acts.filter(a=>a.who.includes(m.id)).flatMap(a=>a.photos);

function render(){
  $('#faces').innerHTML=S.members.slice(0,12).map((m,i)=>`<div onclick="showM('${m.id}')" style="animation-delay:${i*.25}s">${av(m,'')}</div>`).join('').replace(/<div onclick/g,'<div style="display:contents" onclick');
  document.querySelectorAll('#faces .av').forEach((e,i)=>e.style.animationDelay=i*.25+'s');
  const np=S.acts.reduce((a,x)=>a+x.photos.length,0),nv=S.acts.reduce((a,x)=>a+x.videos.length,0);
  $('#stats').innerHTML=`<div><b>${S.members.length}</b><span>anggota</span></div><div><b>${S.acts.length}</b><span>kegiatan</span></div><div><b>${np}</b><span>foto</span></div>`;
  const v=$('#view');
  if(view==='act'){
    const list=[...S.acts].sort((a,b)=>b.date.localeCompare(a.date));
    v.innerHTML='<h2>Kegiatan</h2>'+(list.length?`<div class="grid">${list.map(a=>`<button class="card" onclick="showA('${a.id}')"><div class="cover" style="background-image:${a.photos[0]?`url(${a.photos[0]})`:grad(a.id)}">${a.photos[0]?'':esc(a.emoji||'✨')}${a.photos.length+a.videos.length?`<span class="badge">${a.photos.length} foto${a.videos.length?` · ${a.videos.length} video`:''}</span>`:''}</div><h3>${esc(a.title)}</h3><p class="meta">${fmt(a.date)}</p><div class="stack">${a.who.map(M).filter(Boolean).slice(0,6).map(m=>av(m)).join('')}</div></button>`).join('')}</div>`:'<div class="empty">Belum ada kegiatan. Tekan Tambah untuk menyimpan yang pertama.</div>');
  }else{
    v.innerHTML='<h2>Anggota</h2>'+(S.members.length?`<div class="grid mgrid">${S.members.map(m=>`<button class="card mcard" onclick="showM('${m.id}')"><div class="mban" style="background:${grad(m.id)}"></div>${av(m)}<h3>${esc(m.name)}</h3><div class="role serif">${esc(m.role||'Anggota')}</div><p class="mbio">${esc((m.bio||'').slice(0,80))}</p><p class="meta">${S.acts.filter(a=>a.who.includes(m.id)).length} kegiatan</p></button>`).join('')}</div>`:'<div class="empty">Belum ada anggota. Tekan Tambah untuk mengisi profil pertama.</div>');
  }
}
const open=h=>{$('#dc').innerHTML=`<button class="x" onclick="dlg.close()" aria-label="Tutup">×</button>${h}`;dlg.showModal()};
const gal=p=>p.length?`<div class="photos">${p.map(s=>`<img src="${s}" alt="" onclick="zoom(this.src)">`).join('')}</div>`:'';
function zoom(s){$('#lbi').src=s;lb.showModal()}
function showA(id){
  const a=S.acts.find(x=>x.id===id);
  open(`<h2 style="margin-top:0">${esc(a.title)}</h2><p class="serif" style="font-size:20px;margin:0">${fmt(a.date)}</p><p>${esc(a.desc||'')}</p>${gal(a.photos)}${a.videos.map(s=>`<video src="${s}" controls playsinline></video>`).join('')}${a.videos.length?'':''}<b>Yang ikut</b><div class="chips">${a.who.map(M).filter(Boolean).map(m=>`<button class="chip" style="cursor:pointer" onclick="showM('${m.id}')">${av(m)}${esc(m.name)}</button>`).join('')||'<span class="note">Belum ada anggota ditandai.</span>'}</div><button class="del" onclick="del('a','${a.id}')">Hapus kegiatan</button>`);
}
function showM(id){
  const m=M(id),as=S.acts.filter(a=>a.who.includes(id)),ph=photosOf(m);
  open(`<div style="display:flex;gap:16px;align-items:center;margin-top:6px">${av(m).replace('class="av "','class="av" ').replace('style="','style="width:120px;height:120px;font-size:42px;')}<div><h2 style="margin:0">${esc(m.name)}</h2><div class="role serif">${esc(m.role||'Anggota')}</div></div></div><p>${esc(m.bio||'')}</p><b>Ikut di ${as.length} kegiatan</b><div class="chips">${as.map(a=>`<button class="chip" style="cursor:pointer;padding-left:12px" onclick="showA('${a.id}')">${esc(a.emoji||'')} ${esc(a.title)}</button>`).join('')||'<span class="note">Belum tercatat di kegiatan mana pun.</span>'}</div>${ph.length?'<b>Foto bersama '+esc(m.name.split(' ')[0])+'</b>'+gal(ph):''}<button class="del" onclick="del('m','${m.id}')">Hapus anggota</button>`);
}
function del(t,id){
  if(!confirm('Hapus data ini?'))return;
  if(t==='a')S.acts=S.acts.filter(a=>a.id!==id);
  else{S.members=S.members.filter(m=>m.id!==id);S.acts.forEach(a=>a.who=a.who.filter(w=>w!==id))}
  save();dlg.close();render();
}
const shrink=f=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};i.onerror=()=>r('');i.src=u});
const prevs=(el,arr)=>el.innerHTML=arr.map(s=>`<img src="${s}" alt="">`).join('');
function formM(){
  let photo='';
  open(`<h2 style="margin-top:0">Anggota baru</h2><label for="fn">Nama</label><input type="text" id="fn"><label for="fr">Peran</label><input type="text" id="fr" placeholder="Contoh: Seksi acara"><label for="fb">Cerita singkat</label><textarea id="fb" rows="3"></textarea><label for="ff">Foto profil</label><input type="file" id="ff" accept="image/*"><div class="prev" id="fp"></div><button class="save" id="sv">Simpan anggota</button>`);
  $('#ff').onchange=async e=>{if(e.target.files[0]){photo=await shrink(e.target.files[0]);prevs($('#fp'),[photo])}};
  $('#sv').onclick=()=>{const n=$('#fn').value.trim();if(!n){$('#fn').focus();return}S.members.push({id:uid(),name:n,role:$('#fr').value.trim(),bio:$('#fb').value.trim(),photo});save();dlg.close();view='mem';sync();render()};
}
function formA(){
  let ph=[],vd=[];
  open(`<h2 style="margin-top:0">Kegiatan baru</h2><label for="at">Nama kegiatan</label><input type="text" id="at"><label for="ad">Tanggal</label><input type="date" id="ad"><label for="ae">Ikon (emoji)</label><input type="text" id="ae" maxlength="2" placeholder="⛺"><label for="ac">Cerita</label><textarea id="ac" rows="3"></textarea><label>Siapa yang ikut</label><div class="chk">${S.members.map(m=>`<label><input type="checkbox" value="${m.id}"> ${esc(m.name)}</label>`).join('')||'<span class="note">Tambahkan anggota dulu agar bisa ditandai.</span>'}</div><label for="ap">Foto (boleh banyak)</label><input type="file" id="ap" accept="image/*" multiple><div class="prev" id="pp"></div><label for="av">Video</label><input type="file" id="av" accept="video/*" multiple><p class="note">Video hanya tampil selama halaman ini terbuka; foto tersimpan di perangkat ini.</p><button class="save" id="sv">Simpan kegiatan</button>`);
  $('#ap').onchange=async e=>{ph=await Promise.all([...e.target.files].map(shrink));ph=ph.filter(Boolean);prevs($('#pp'),ph)};
  $('#av').onchange=e=>{vd=[...e.target.files].map(f=>URL.createObjectURL(f))};
  $('#sv').onclick=()=>{const t=$('#at').value.trim();if(!t){$('#at').focus();return}S.acts.push({id:uid(),title:t,date:$('#ad').value||new Date().toISOString().slice(0,10),emoji:$('#ae').value||'✨',desc:$('#ac').value.trim(),photos:ph,videos:vd,who:[...document.querySelectorAll('.chk input:checked')].map(i=>i.value)});save();dlg.close();view='act';sync();render()};
}
function sync(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;sync();render()});
$('#addBtn').onclick=()=>view==='mem'?formM():formA();
const _render=render;render=()=>{_render();document.querySelectorAll('.card').forEach((c,i)=>c.style.animationDelay=i*70+'ms')};
if(matchMedia('(hover:hover)').matches){
$('#view').addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transition='transform .08s';c.style.transform=`perspective(700px) rotateX(${-y*8}deg) rotateY(${x*10}deg) translateY(-6px)`});
$('#view').addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){c.style.transition='';c.style.transform=''}});
}
render();
</script>
</body>
</html>
